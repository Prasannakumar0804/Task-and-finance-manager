<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task & Finance Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Task & Finance Manager</h1>

        <div id="auth-section">
            <h2>Register</h2>
            <input type="text" id="reg-username" placeholder="Username">
            <input type="password" id="reg-password" placeholder="Password">
            <button onclick="register()">Register</button>
            <p id="reg-message"></p>

            <h2>Login</h2>
            <input type="text" id="login-username" placeholder="Username">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="login()">Login</button>
            <p id="login-message"></p>
        </div>

        <div id="app-section" style="display:none;">
            <p>Logged in as <strong id="current-user"></strong> <button onclick="logout()">Logout</button></p>

            <h2>Dashboard</h2>
            <div class="summary-cards">
                <div class="card income">Income<br><span id="total-income">0</span></div>
                <div class="card expense">Expenses<br><span id="total-expenses">0</span></div>
                <div class="card savings">Savings<br><span id="total-savings">0</span></div>
            </div>

             <div class="charts-row">
            <div class="chart-box">
            <canvas id="chart" height="150"></canvas>
           </div>
         <div class="chart-box">
          <canvas id="pie-chart" height="150"></canvas>
       </div>
     </div>

            <h2>Add Transaction</h2>
            <input type="number" id="tx-amount" placeholder="Amount">
            <select id="tx-type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
            <input type="text" id="tx-category" placeholder="Category (e.g. food, salary)">
            <input type="text" id="tx-description" placeholder="Description (optional)">
            <button onclick="addTransaction()">Add Transaction</button>
            <p id="tx-message"></p>

            <h2>Transaction History</h2>
            <table id="tx-table">
                <thead>
                    <tr><th>Type</th><th>Category</th><th>Amount</th><th>Description</th><th>Date</th><th></th></tr>
                </thead>
                <tbody id="tx-list"></tbody>
            </table>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
